    <style>
        :root {
            --color-bg: #050505;
            --color-surface: #0a0a0d;
            --color-primary: #18181B;
            --color-secondary: #3F3F46;
            --color-text: #FAFAFA;
            --color-accent-solid: #2563EB;
            --color-accent-start: #00f2fe;
            --color-accent-end: #4facfe;
            --color-accent-violet: #8b5cf6;
            --color-accent-glow: rgba(0, 242, 254, 0.4);
            --neon: var(--color-accent-solid);
            --neon-glow: rgba(37, 99, 235, 0.5);
            --bg: var(--color-primary);
            --text: var(--color-text);
            --secondary: var(--color-secondary);
        }
        html { scroll-padding-top: 100px; }
        body {
            font-family: 'Archivo', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        .font-jakarta { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-archivo { font-family: 'Archivo', sans-serif; }
        .font-space { font-family: 'Space Grotesk', sans-serif; }
        
        .noise {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            opacity: 0.03;
            z-index: 9999;
            background-image: url('https://grainy-gradients.vercel.app/noise.svg');
        }

        .grid-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(to right, color-mix(in srgb, var(--color-accent-solid) 5%, transparent) 1px, transparent 1px),
                              linear-gradient(to bottom, color-mix(in srgb, var(--color-accent-solid) 5%, transparent) 1px, transparent 1px);
            background-size: 80px 80px;
            opacity: 0.4;
            z-index: -1;
            pointer-events: none;
        }

        #custom-cursor {
            width: 8px;
            height: 8px;
            background: var(--neon);
            border-radius: 2px;
            position: fixed;
            pointer-events: none;
            z-index: 10000;
            transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1), height 0.3s cubic-bezier(0.16, 1, 0.3, 1), transform 0.08s linear, background 0.3s;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px var(--neon-glow);
        }
        
        #cursor-follower {
            width: 44px;
            height: 44px;
            border: 1px solid color-mix(in srgb, var(--color-accent-solid) 20%, transparent);
            border-radius: 4px;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1), height 0.4s cubic-bezier(0.16, 1, 0.3, 1), left 0.2s cubic-bezier(0.16, 1, 0.3, 1), top 0.2s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s;
            transform: translate(-50%, -50%);
        }

        .cursor-hover #custom-cursor {
            width: 80px;
            height: 80px;
            background: var(--neon);
            mix-blend-mode: overlay;
            border-radius: 50%;
        }
        
        .cursor-hover #cursor-follower {
            width: 100px;
            height: 100px;
            opacity: 0;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--secondary); border-radius: 0; }
        ::-webkit-scrollbar-thumb:hover { background: var(--neon); }

        @keyframes scan {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
        .scanline {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 4px;
            background: linear-gradient(to bottom, transparent, color-mix(in srgb, var(--color-accent-solid) 5%, transparent), transparent);
            z-index: 9998;
            pointer-events: none;
            animation: scan 10s linear infinite;
        }

        @keyframes glitch {
            0% { clip-path: inset(80% 0 0 0); transform: translate(-2px, -2px); }
            10% { clip-path: inset(10% 0 85% 0); transform: translate(2px, 2px); }
            20% { clip-path: inset(80% 0 0 0); transform: translate(-2px, -2px); }
            30% { clip-path: inset(10% 0 85% 0); transform: translate(2px, 2px); }
            40% { clip-path: inset(50% 0 30% 0); transform: translate(-2px, -2px); }
            50% { clip-path: inset(10% 0 85% 0); transform: translate(2px, 2px); }
            60% { clip-path: inset(80% 0 0 0); transform: translate(-2px, -2px); }
            70% { clip-path: inset(10% 0 85% 0); transform: translate(2px, 2px); }
            80% { clip-path: inset(50% 0 30% 0); transform: translate(-2px, -2px); }
            90% { clip-path: inset(10% 0 85% 0); transform: translate(2px, 2px); }
            100% { clip-path: inset(80% 0 0 0); transform: translate(-2px, -2px); }
        }

        .glitch-text:hover {
            animation: glitch 0.3s cubic-bezier(.25, .46, .45, .94) both infinite;
            text-shadow: 2px 0 #ff00c1, -2px 0 #00fff9;
        }

        * {
          -webkit-tap-highlight-color: transparent;
        }

        /* Keyboard accessibility: restore focus outline for keyboard users */
        :focus-visible {
          outline: 2px solid var(--color-accent-start);
          outline-offset: 2px;
          border-radius: 4px;
        }

        /* Respect reduced motion preference */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
            .scanline { display: none; }
            #custom-cursor, #cursor-follower { display: none; }
            body { cursor: auto; }
        }

        /* Desktop-only: custom cursor and hidden native cursor */
        @media (pointer: fine) {
            body { cursor: none; }
        }
        @media (pointer: coarse) {
            #custom-cursor, #cursor-follower { display: none; }
            body { cursor: auto; }
        }
        
        ::selection { background: var(--neon); color: white; }
        ::-moz-selection { background: var(--neon); color: white; }

        .reveal-text {
            clip-path: inset(0 0 100% 0);
        }
    
        /* Campuran / Mixed Gradient */
        .text-accent {
            background: linear-gradient(135deg, var(--color-accent-start) 0%, var(--color-accent-end) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }
        .bg-accent {
            background: linear-gradient(135deg, var(--color-accent-start) 0%, var(--color-accent-end) 100%) !important;
            color: #050505 !important;
        }
        .border-accent {
            border-color: var(--color-accent-start) !important;
        }
        .accent-glow {
            box-shadow: 0 0 20px var(--color-accent-glow) !important;
        }
        .group:hover .group-hover\:text-accent {
            background: linear-gradient(135deg, var(--color-accent-start) 0%, var(--color-accent-end) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }
        .group:hover .group-hover\:bg-accent {
            background: linear-gradient(135deg, var(--color-accent-start) 0%, var(--color-accent-end) 100%) !important;
            color: #050505 !important;
        }
        .group:hover .group-hover\:border-accent {
            border-color: var(--color-accent-start) !important;
        }
        .hover\:text-accent:hover {
            background: linear-gradient(135deg, var(--color-accent-start) 0%, var(--color-accent-end) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }

</style>

              }
            }
          }
        }
      }
    </script>

    <div id="cursor-follower"></div>
    <div id="root"></div>
